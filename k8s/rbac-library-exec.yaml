# Backend pod ko library pod ke andar exec karne ki permission deta hai.
# default ServiceAccount (thinkcloud namespace) ko pods/exec allow karta hai.

apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pod-exec-role
  namespace: thinkcloud
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pod-exec-rolebinding
  namespace: thinkcloud
subjects:
  - kind: ServiceAccount
    name: default
    namespace: thinkcloud
roleRef:
  kind: Role
  apiGroup: rbac.authorization.k8s.io
  name: pod-exec-role
